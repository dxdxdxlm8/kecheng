# nginx 反向代理配置（模板 / 现网配置备份）
# 部署位置：/etc/nginx/sites-available/kecheng，软链到 sites-enabled/kecheng
#
# 使用说明：
# 1. 先按 DEPLOY_VPS.md 用下面的 HTTP 版跑通 80 端口，再执行
#      bash scripts/deploy/setup-domain.sh shuxueyst.dpdns.org
#    让 certbot 自动生成 HTTPS 块（文件中标记 "# managed by Certbot" 的行
#    由 certbot 维护，不要手改，改了可能被覆盖）。
# 2. 本文件只负责维护业务相关的 location 规则。
# 3. 判题是 invokeChat 非流式等完整 JSON，单次 30-60s + 一次重试，
#    所以代理超时统一放宽到 300s，且必须 proxy_buffering off（否则 SSE 流式被缓冲）。
#
# 入口分工（2026-08-30 定稿）：
#   /            -> 302 /student/login   域名根路径直达学生端
#   /teacher     -> 302 /teacher/login   教师端（应用没有裸 /teacher 路由，故补跳转）
#   /adminlogin  -> 原首页（由 next.config.ts 的 rewrite 映射，nginx 不参与）

server {
    server_name shuxueyst.dpdns.org www.shuxueyst.dpdns.org;

    # 学生上传解题图片，放宽体积限制
    client_max_body_size 25m;

    # 域名根路径直达学生端
    # location = / 是精确匹配，优先级高于下面的 location /，不会吃掉反向代理
    location = / {
        return 302 https://shuxueyst.dpdns.org/student/login;
    }

    # 教师端快捷入口（应用无裸 /teacher 路由，不跳转会 404）
    location = /teacher {
        return 302 https://shuxueyst.dpdns.org/teacher/login;
    }

    # 域名/CA 验证文件，由 nginx 直接托管，不经过 Node
    # （注意：Next.js 的 public/ 是构建时快照，放进去必须重新 build 才生效）
    location = /245793a2da3419e1ab25ec847cf29acb.txt {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # SSE 流式输出（聊天/判题用），必须长连接不缓冲
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/shuxueyst.dpdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/shuxueyst.dpdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.shuxueyst.dpdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = shuxueyst.dpdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name shuxueyst.dpdns.org www.shuxueyst.dpdns.org;
    return 404; # managed by Certbot
}
